[project]
name = "oral-fluorescence-detection"
version = "0.1.0"
description = "Whole-image classification for oral fluorescence and white-light images"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "albumentations>=2.0",
    "matplotlib>=3.9",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "tensorboard>=2.18",
    "torch>=2.6",
    "torchvision>=0.21",
    "tqdm>=4.67",
]
dev = [
    "jupyterlab>=4.3",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oral_fluorescence_detection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
