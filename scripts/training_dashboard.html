<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>口腔荧光 · 训练进程</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#0c1423;color:#e5edf8}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:6px 0 10px}h2{font-size:16px;margin:0 0 18px}.muted{color:#9cacc3;font-size:13px;line-height:1.7}.badge{color:#58dacb;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card,.panel{background:#142035;border:1px solid #25334b;border-radius:12px;padding:22px}.value{font-size:25px;font-weight:650;margin:10px 0}.progress{height:7px;background:#29374c;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#56d5c7;transition:width .3s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}svg{width:100%;height:260px;display:block}svg text{fill:#b7c5d9;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #2b384d}th{color:#93a7c3;font-weight:500}.done{color:#59d8bc}.active{color:#f5c777}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#a8bdd5;max-height:230px;overflow:auto}button{background:#243853;color:#d9e7f5;border:1px solid #3d5472;border-radius:7px;padding:8px 14px;cursor:pointer}.tablewrap{overflow-x:auto}footer{margin-top:20px}@media(max-width:760px){body{padding:16px}.cards,.grid{grid-template-columns:1fr}h1{font-size:22px}.card{padding:16px}}
</style></head><body>
<header><div><div class="badge">ORAL FLUORESCENCE / TRAINING</div><h1>架构与损失消融 · 实时进程</h1><div id="phase" class="muted">读取日志…</div></div><button id="refresh">立即刷新</button></header>
<div class="cards"><section class="card"><div class="muted">实验完成数</div><div class="value" id="completed">— / 8</div><div class="progress"><div id="overall" style="width:0"></div></div></section><section class="card"><div class="muted">当前实验</div><div class="value" id="current">—</div><div class="muted" id="config">—</div></section><section class="card"><div class="muted" id="progresslabel">当前轮训练批次（不含验证）</div><div class="value" id="batch">—</div><div class="progress"><div id="batchbar" style="width:0"></div></div></section></div>
<div class="grid"><section class="panel"><h2 id="losstitle">当前轮累计平均训练损失</h2><svg id="loss" role="img" aria-label="批次与累计平均训练损失曲线"></svg><div class="muted"><span id="lossnote">每25批记录；累计平均值，不是单批损失。不同损失函数的数值不直接比较。</span></div></section><section class="panel"><h2 id="auctitle">已完成试跑 · 验证 AUROC</h2><svg id="auc" role="img" aria-label="已完成实验的验证AUROC"></svg><div class="muted"><span id="aucnote">每组仅1轮，展示流程结果，不作架构优劣结论。</span></div></section></div>
<section class="panel"><h2 id="experimenttitle">实验进度</h2><div class="tablewrap"><table><thead><tr><th>编号</th><th>架构</th><th>新增注意力</th><th>损失</th><th>状态</th><th>验证损失 CE</th><th>AUROC</th><th>平衡准确率</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel" style="margin-top:18px"><h2>最近日志</h2><pre id="logs"></pre><pre id="errors" style="color:#ffb4a7"></pre></section>
<footer class="muted"><div id="updated"></div><div id="note"></div><div id="connection"></div></footer>
<script>
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';let latest=null,busy=false;
function el(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function chart(id,data,ylabel,bar=false,reference=[]){const svg=$(id),w=Math.max(svg.clientWidth,300),h=260,l=58,r=16,t=20,b=47;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();if(!data.length){svg.append(el('text',{x:20,y:80},'等待训练日志…'));return}const xmin=bar?0:Math.min(...data.map(d=>d[0])),xmax=bar?7:Math.max(...data.map(d=>d[0]));let ymin=bar?0:Math.min(...data.concat(reference).map(d=>d[1])),ymax=bar?1:Math.max(...data.concat(reference).map(d=>d[1]));if(!bar){const p=Math.max((ymax-ymin)*.15,.025);ymin=Math.max(0,ymin-p);ymax+=p}const x=v=>l+(v-xmin)/(xmax-xmin||1)*(w-l-r),y=v=>h-b-(v-ymin)/(ymax-ymin||1)*(h-b-t);for(let i=0;i<5;i++){const v=ymin+(ymax-ymin)*i/4;svg.append(el('line',{x1:l,y1:y(v),x2:w-r,y2:y(v),stroke:'#2a3b55'}),el('text',{x:l-8,y:y(v)+4,'text-anchor':'end'},v.toFixed(2)))}svg.append(el('text',{x:l,y:12},ylabel),el('text',{x:w/2,y:h-8,'text-anchor':'middle'},bar?'实验编号':latest?.mode==='formal'?'Epoch':'训练批次'));if(bar){for(let i=0;i<8;i++)svg.append(el('text',{x:x(i),y:h-b+20,'text-anchor':'middle'},i));data.forEach(([a,v])=>{svg.append(el('rect',{x:x(a)-Math.min(16,(w-l-r)/24),y:y(v),width:Math.min(32,(w-l-r)/12),height:Math.max(0,y(0)-y(v)),fill:'#63b6ee',rx:3}),el('text',{x:x(a),y:y(v)-7,'text-anchor':'middle'},v.toFixed(2)))});svg.append(el('line',{x1:l,y1:y(.5),x2:w-r,y2:y(.5),stroke:'#dcba68','stroke-dasharray':'4 4'}))}else{for(let i=0;i<4;i++){const v=xmin+(xmax-xmin)*i/3;svg.append(el('text',{x:x(v),y:h-b+20,'text-anchor':'middle'},Math.round(v)))}svg.append(el('polyline',{points:data.map(([a,v])=>`${x(a)},${y(v)}`).join(' '),fill:'none',stroke:'#58dacb','stroke-width':2.5}));if(reference.length)svg.append(el('polyline',{points:reference.map(([a,v])=>`${x(a)},${y(v)}`).join(' '),fill:'none',stroke:'#f5c777','stroke-width':2.5}));data.forEach(([a,v])=>svg.append(el('circle',{cx:x(a),cy:y(v),r:3,fill:'#58dacb'})))}}
function draw(s){latest=s;document.querySelector('h1').textContent=s.title??'架构与损失消融 · 实时进程';$('experimenttitle').textContent=s.variants.length+'组实验进度';$('phase').textContent=s.phase;$('progresslabel').textContent=s.mode==='formal'?'当前实验已完成轮数（可能早停）':'当前轮训练批次（不含验证）';$('completed').textContent=s.completed.length+' / '+s.variants.length;$('overall').style.width=(s.completed.length/Math.max(s.variants.length,1)*100)+'%';const cfg=s.variants.find(v=>v.index===s.current);$('current').textContent=cfg?'#'+cfg.index+' '+cfg.model:'等待';$('config').textContent=cfg?cfg.attention+' / '+cfg.loss+(cfg.seed?' / seed '+cfg.seed:''):'';const p=s.points.at(-1);$('batch').textContent=p?`${p.batch} / ${p.batches}`:'—';$('batchbar').style.width=p?(p.batch/p.batches*100)+'%':'0';$('rows').replaceChildren();s.variants.forEach(v=>{const done=s.completed.find(d=>d.variant===v.index),tr=document.createElement('tr');const status=done?'已完成':v.index===s.current?s.phase:'等待';[v.index,v.model+(v.seed?' · seed '+v.seed:''),v.attention,v.loss,status,done?.validation.loss,done?.validation.auroc,done?.validation.balanced_accuracy].forEach((value,i)=>{const td=document.createElement('td');td.textContent=typeof value==='number'&&i>4?value.toFixed(4):value??'—';if(i===4)td.className=done?'done':v.index===s.current?'active':'';tr.append(td)});$('rows').append(tr)});if(s.mode==='formal'){
$('batch').textContent=`${s.epoch} / ${s.max_epochs}`;$('batchbar').style.width=(s.epoch/s.max_epochs*100)+'%';
$('losstitle').textContent='每轮损失 · 训练与验证';$('lossnote').textContent='青色：训练损失；黄色：验证交叉熵。每轮完成后更新。';
$('auctitle').textContent='当前模型 · 每轮验证 AUROC';$('aucnote').textContent=s.best?`最低验证CE出现在第${s.best.epoch}轮：CE ${s.best.val_metrics.loss.toFixed(4)}，AUROC ${s.best.val_metrics.auroc?.toFixed(4)??'未定义'}`:'等待首轮验证';
chart('loss',s.history.map(h=>[h.epoch,h.train_loss]),'损失',false,s.history.map(h=>[h.epoch,h.val_metrics.loss]));chart('auc',s.history.filter(h=>Number.isFinite(h.val_metrics.auroc)).map(h=>[h.epoch,h.val_metrics.auroc]),'AUROC');
}else{chart('loss',s.points.map(p=>[p.batch,p.train_loss]),'损失');chart('auc',s.completed.filter(d=>Number.isFinite(d.validation.auroc)).map(d=>[d.variant,d.validation.auroc]),'AUROC',true);}$('logs').textContent=s.tail.join('\n');$('errors').textContent=s.error_tail.join('\n');$('updated').textContent=(s.mode==='formal'?'最近完成轮次：':'最近日志：')+(s.updated??'暂无')+' · '+(s.log_age_seconds??'—')+'秒前';$('note').textContent=s.note;$('connection').textContent=s.mode==='formal'?'每3秒读取训练历史；轮内无新数据不代表停止训练。':s.log_age_seconds>120?'日志超过2分钟未更新，请结合进程状态判断；页面仍每3秒刷新。':'每3秒自动刷新'}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);draw(await r.json())}catch(e){$('connection').textContent='连接失败：'+e.message+'；正在重试'}finally{busy=false}}
$('refresh').onclick=refresh;new ResizeObserver(()=>{if(latest)draw(latest)}).observe($('loss').parentElement);refresh();setInterval(refresh,3000);
</script></body></html>
