# 数据集构建配置（VOC -> YOLO）
#
# 【重要】names / class_map 的取值需与标注方确认：
#   l / n 的临床含义尚未最终确认。确认后修改本文件，并重新运行
#   python scripts/prepare_data.py

names:
  - l
  - n

class_map:
  l: 0
  n: 1

split:
  ratios: [0.7, 0.15, 0.15]   # train / val / test，按【患者】划分
  seed: 42
  include_background: true     # 无标注图片作为背景样本纳入

link_mode: hardlink            # copy / symlink / hardlink
output: datasets/oral_fluorescence
