# Binary classification baseline for l/n labels.
# The clinical meaning of l and n is intentionally not asserted here.

seed: 42
manifest: data/processed/binary_v2/manifest.csv
summary: data/processed/binary_v2/split_summary.json
experiment_dir: experiments/binary_resnet18_lpos_v1

split:
  ratios: [0.70, 0.15, 0.15]

data:
  image_size: 224
  num_workers: 4

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.30

training:
  batch_size: 32
  stage1_epochs: 4
  stage2_epochs: 10
  stage1_lr: 0.001
  stage2_lr: 0.0002
  weight_decay: 0.0001
  patience: 5
  amp: true

evaluation:
  threshold: 0.50
  bootstrap: 1000

